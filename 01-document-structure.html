<!doctype html>
<!-- Tells the browser that this document uses HTML5 -->

<html lang="en">
  <!-- Root element of the HTML document -->

  <head>
    <!-- Contains information about the webpage -->

    <meta charset="UTF-8" />
    <!-- Supports letters, symbols, and different languages -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Makes the webpage display properly on different screen sizes -->

    <title>My First Webpage</title>
    <!-- Text displayed on the browser tab -->
  </head>

  <body>
    <!-- Contains everything visible on the webpage -->

    <h1>Welcome to My Website</h1>

    <p>
      This is my first HTML webpage. I am learning how HTML creates the
      structure of a website.
    </p>

    <h2>About This Page</h2>

    <p>
      HTML stands for HyperText Markup Language. It is used to structure content
      such as headings, paragraphs, images, links, tables, and forms.
    </p>
  </body>
</html>
<!-- Ends the HTML document -->
